<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AUTO LINE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: #1c1c1c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #00ffaa;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        
        .styled-input {
            width: 100%;
            padding: 14px;
            background: #1c1c1c;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 16px;
            color: white;
            direction: ltr;
            text-align: right;
        }
        
        .styled-input:focus {
            outline: none;
            border-color: #00ffaa;
        }
        
        .toggle-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .toggle-btn {
            padding: 14px;
            background: #1c1c1c;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .toggle-btn.active {
            background: rgba(0,255,170,0.15);
            border-color: #00ffaa;
            color: #00ffaa;
        }
        
        .status-box {
            padding: 14px;
            background: #1c1c1c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 16px;
            min-height: 50px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #888;
        }
        
        .status-box.success { 
            color: #22c55e; 
            border-color: #22c55e;
        }
        
        .status-box.error { 
            color: #ef4444; 
            border-color: #ef4444;
        }
        
        .status-box.processing { 
            color: #eab308; 
            border-color: #eab308;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ffaa, #00cc88);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .history-section {
            margin-top: 24px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #00ffaa;
        }
        
        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            background: #1c1c1c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }
        
        .history-phone {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            direction: ltr;
            text-align: right;
        }
        
        .history-type {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(34,197,94,0.15);
            color: #22c55e;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- סטטיסטיקות -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalSubs">0</div>
                <div class="stat-label">סה"כ</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todaySubs">0</div>
                <div class="stat-label">היום</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successRate">100%</div>
                <div class="stat-label">הצלחה</div>
            </div>
        </div>
        
        <!-- מספר טלפון -->
        <div class="input-group">
            <label class="input-label">📱 מספר טלפון / שם משתמש</label>
            <input 
                type="text" 
                id="phoneInput" 
                class="styled-input" 
                placeholder="הזן מספר טלפון..."
            />
        </div>
        
        <!-- סוג מנוי -->
        <div class="toggle-buttons">
            <button class="toggle-btn active" id="dailyBtn" onclick="selectType('daily')">
                📆 יומי
            </button>
            <button class="toggle-btn" id="yearlyBtn" onclick="selectType('yearly')">
                🗓️ שנתי
            </button>
        </div>
        
        <!-- סטטוס -->
        <div class="status-box" id="statusBox">
            ℹ️ מוכן לפעולה
        </div>
        
        <!-- כפתור פעולה -->
        <button class="action-btn" id="startBtn" onclick="startAutomation()">
            ▶ התחל אוטומציה
        </button>
        
        <!-- היסטוריה -->
        <div class="history-section">
            <div class="section-title">📋 היסטוריה אחרונה</div>
            <div class="history-list" id="historyList">
                <div class="empty-state">
                    אין היסטוריה עדיין
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let selectedType = 'daily';
        let stats = {
            totalSubs: 0,
            todaySubs: 0,
            successRate: 100
        };
        let history = [];
        
        // טעינת נתונים
        function loadData() {
            const savedStats = localStorage.getItem('autoLineStats');
            const savedHistory = localStorage.getItem('autoLineHistory');
            
            if (savedStats) {
                stats = JSON.parse(savedStats);
                updateStatsDisplay();
            }
            
            if (savedHistory) {
                history = JSON.parse(savedHistory);
                updateHistoryDisplay();
            }
        }
        
        // עדכון תצוגת סטטיסטיקות
        function updateStatsDisplay() {
            document.getElementById('totalSubs').textContent = stats.totalSubs;
            document.getElementById('todaySubs').textContent = stats.todaySubs;
            document.getElementById('successRate').textContent = stats.successRate + '%';
        }
        
        // עדכון היסטוריה
        function updateHistoryDisplay() {
            const list = document.getElementById('historyList');
            
            if (history.length === 0) {
                list.innerHTML = '<div class="empty-state">אין היסטוריה עדיין</div>';
                return;
            }
            
            list.innerHTML = history.slice(0, 5).map(item => `
                <div class="history-item">
                    <div class="history-phone">📱 ${item.phone}</div>
                    <span class="history-type">✓ ${item.type}</span>
                </div>
            `).join('');
        }
        
        // בחירת סוג מנוי
        function selectType(type) {
            selectedType = type;
            
            document.getElementById('dailyBtn').classList.remove('active');
            document.getElementById('yearlyBtn').classList.remove('active');
            
            if (type === 'daily') {
                document.getElementById('dailyBtn').classList.add('active');
            } else {
                document.getElementById('yearlyBtn').classList.add('active');
            }
        }
        
        // עדכון סטטוס
        function updateStatus(message, type = '') {
            const box = document.getElementById('statusBox');
            box.textContent = message;
            box.className = 'status-box ' + type;
        }
        
        // התחלת אוטומציה
        async function startAutomation() {
            const phone = document.getElementById('phoneInput').value.trim();
            
            if (!phone) {
                updateStatus('❌ נא להזין מספר טלפון', 'error');
                return;
            }
            
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = '⏳ מעבד...';
            
            updateStatus('⚙️ מתחיל תהליך אוטומציה...', 'processing');
            
            // סימולציה (כאן יופעל הקוד האמיתי)
            setTimeout(() => {
                // הוספה להיסטוריה
                const item = {
                    phone: phone,
                    type: selectedType === 'yearly' ? 'מנוי שנתי' : 'מנוי יומי',
                    timestamp: new Date().toLocaleString('he-IL')
                };
                
                history.unshift(item);
                if (history.length > 20) history.pop();
                
                // עדכון סטטיסטיקות
                stats.totalSubs++;
                stats.todaySubs++;
                
                // שמירה
                localStorage.setItem('autoLineStats', JSON.stringify(stats));
                localStorage.setItem('autoLineHistory', JSON.stringify(history));
                
                // עדכון תצוגה
                updateStatsDisplay();
                updateHistoryDisplay();
                updateStatus('✅ מנוי נפתח בהצלחה!', 'success');
                
                // ניקוי שדה
                document.getElementById('phoneInput').value = '';
                
                // החזרת כפתור
                btn.disabled = false;
                btn.textContent = '▶ התחל אוטומציה';
                
                // איפוס סטטוס
                setTimeout(() => {
                    updateStatus('ℹ️ מוכן לפעולה', '');
                }, 3000);
            }, 2000);
        }
        
        // טעינה ראשונית
        loadData();
        
        // Enter key support
        document.getElementById('phoneInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startAutomation();
            }
        });
    </script>
</body>
</html>
